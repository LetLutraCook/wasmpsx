
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ps1</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
        #game-container { width: 100%; height: 100vh; display: none; }
        .upload-box { border: 2px dashed #555; padding: 30px; border-radius: 10px; text-align: center; }
        input { margin-top: 10px; }
    </style>
</head>
<body>

    <div id="setup">
        <div class="upload-box">
            <h3>PS1 Emulator</h3>
            <p>Select your Game (.cue or .chd)</p>
            <input type="file" id="rom-input" accept=".cue,.bin,.chd,.pbp">
            <p style="font-size: 12px; color: #888;">Note: BIOS must be named scph5501.bin in the same folder as this HTML</p>
        </div>
    </div>

    <div id="game-container">
        <div id="emulator"></div>
    </div>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    <script>
        document.getElementById('rom-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const romUrl = URL.createObjectURL(file);
            
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            EJS_player = "#emulator";
            EJS_core = "psx";
            EJS_gameUrl = romUrl;
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            EJS_biosUrl = "scph5501.bin"; 
            EJS_startOnLoaded = true;

            const loader = document.createElement('script');
            loader.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(loader);
        });
    </script>
</body>
</html>
