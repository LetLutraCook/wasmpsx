<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS1 Loader</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
        #game-container { width: 100%; height: 100vh; display: none; }
        .upload-box { border: 2px dashed #555; padding: 30px; border-radius: 10px; text-align: center; background: #1a1a1a; }
        input { margin: 10px 0; display: block; width: 100%; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; border: none; color: white; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="setup">
        <div class="upload-box">
            <h3>PS1 Emulator</h3>
            <label>1. Select BIOS (PSPONPSX660.bin)</label>
            <input type="file" id="bios-input">
            
            <label>2. Select Game (.cue, .chd, .pbp)</label>
            <input type="file" id="rom-input">
            
            <button id="start-btn">Launch Game</button>
        </div>
    </div>

    <div id="game-container">
        <div id="emulator"></div>
    </div>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    <script>
        let biosUrl = "";
        let romUrl = "";

        document.getElementById('bios-input').addEventListener('change', function(e) {
            if (e.target.files[0]) biosUrl = URL.createObjectURL(e.target.files[0]);
        });

        document.getElementById('rom-input').addEventListener('change', function(e) {
            if (e.target.files[0]) romUrl = URL.createObjectURL(e.target.files[0]);
        });

        document.getElementById('start-btn').addEventListener('click', function() {
            if (!biosUrl || !romUrl) {
                alert("Please select both a BIOS and a Game file.");
                return;
            }

            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            EJS_player = "#emulator";
            EJS_core = "psx";
            EJS_gameUrl = romUrl;
            EJS_biosUrl = biosUrl;
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            EJS_startOnLoaded = true;

            const loader = document.createElement('script');
            loader.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(loader);
        });
    </script>
</body>
</html>
